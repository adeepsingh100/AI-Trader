name: Risk check

# Stop-loss/take-profit + circuit-breaker sweep only — no LLM calls, no
# market snapshot. Runs every 1min in prod (Cloud Scheduler, see
# deploy/README.md) so an open position isn't sitting unwatched for the
# full gap between trading_cycle.yml runs. This file is a manual
# workflow_dispatch fallback only, not the live trigger — see
# src/orchestrator.py:run_risk_check.
#
# No `schedule:` trigger — GitHub Actions' own cron is unreliable below
# ~15min cadence (observed 40-57min gaps on a nominal 5min schedule).
# Triggered externally via workflow_dispatch on a real clock instead.

on:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.orchestrator --mode=paper --risk-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Self Diagnostics (PROJECT_SPEC.md §3d) — its own step, not merged
      # into run_risk_check, so it fails independently of the SL/TP sweep
      # above. Piggybacks on this cron's 5-minute interval rather than a
      # new workflow file, which risks silently going stale unnoticed.
      - run: python -m src.monitoring.diagnostics --mode=paper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # No-ops cleanly until a version is promoted — see src/orchestrator.py.
      - run: python -m src.orchestrator --mode=real --risk-only
        env:
          COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
          COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m src.monitoring.diagnostics --mode=real
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
