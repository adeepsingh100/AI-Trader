name: Risk check

# Stop-loss/take-profit + circuit-breaker sweep only — no LLM calls, no
# market snapshot. So an open position isn't sitting unwatched for the
# full gap between trading_cycle.yml runs — see
# src/orchestrator.py:run_risk_check.
#
# No `schedule:` trigger — GitHub Actions' own cron is unreliable below
# ~15min cadence (observed 40-57min gaps on a nominal 5min schedule).
# This is the actual live trigger path: an external pinger hits
# dashboard/src/app/api/cron/[workflow]/route.ts on a real clock, which
# dispatches this workflow via the GitHub API — deploy/README.md
# describes a GCP Cloud Run + Cloud Scheduler setup that documents an
# alternative path, not what's actually deployed (confirmed directly
# with the repo owner — no gcloud setup exists; these GH Actions crons
# are the live ones).

on:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.orchestrator --mode=paper --risk-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      # Self Diagnostics (PROJECT_SPEC.md §3d) — its own step, not merged
      # into run_risk_check, so it fails independently of the SL/TP sweep
      # above. Piggybacks on this cron's 5-minute interval rather than a
      # new workflow file, which risks silently going stale unnoticed.
      - run: python -m src.monitoring.diagnostics --mode=paper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # No-ops cleanly until a version is promoted — see src/orchestrator.py.
      - run: python -m src.orchestrator --mode=real --risk-only
        env:
          COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
          COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: python -m src.monitoring.diagnostics --mode=real
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
