name: Evolution

on:
  # 18:45 UTC = 00:15 IST — just after the IST trading-day rollover
  # (PROJECT_SPEC.md §2/§9), so it reviews the day that just closed.
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.agents.evolution_agent
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_CHAIN: ${{ secrets.GROQ_MODEL_CHAIN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL_CHAIN: ${{ secrets.OLLAMA_MODEL_CHAIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Adaptive Strategy Intelligence Engine (PROJECT_SPEC.md §3b) — pure
      # statistics, no LLM calls, so no LLM secrets needed. Runs after
      # evolution_agent so its weight/threshold recommendations and
      # feature-importance rows are already fresh for the day.
      - run: python -m src.learning.adaptive_strategy_engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Feature Drift Detection + Strategy Health Engine (PROJECT_SPEC.md
      # §3d) — each its own step, after but never merged into the two
      # steps above (same "independent learning steps stay independent"
      # rule adaptive_strategy_engine already follows). Pure statistics,
      # no LLM calls, so no LLM secrets needed.
      - run: python -m src.learning.drift_detection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: python -m src.learning.strategy_health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
